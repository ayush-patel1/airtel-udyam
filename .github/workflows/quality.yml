name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Summarise production dependency advisories
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e 'const a=require("./audit.json"); const v=a.vulnerabilities||{}; console.log(JSON.stringify(Object.entries(v).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable})),null,2));'
      - name: Run API smoke tests
        run: npm test
